<!DOCTYPE html>
<html lang="en" data-theme="aurora" class="booting">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <meta name="theme-color" content="#0b0918">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main class="stage">
        <div class="tilt">
            <div class="calculator">

                <header class="calc-top">
                    <button class="brand" type="button" aria-label="Nova">
                        <span class="brand-dot"></span>
                        <span class="brand-name">Nova</span>
                    </button>
                    <div class="themes" role="group" aria-label="Theme">
                        <button class="theme-dot" type="button" data-theme="aurora" style="--a: 258; --b: 335" aria-label="Aurora theme"></button>
                        <button class="theme-dot" type="button" data-theme="ocean" style="--a: 196; --b: 162" aria-label="Ocean theme"></button>
                        <button class="theme-dot" type="button" data-theme="ember" style="--a: 18; --b: 342" aria-label="Ember theme"></button>
                        <button class="theme-dot" type="button" data-theme="mint" style="--a: 156; --b: 88" aria-label="Mint theme"></button>
                        <button class="theme-dot" type="button" data-theme="gold" style="--a: 44; --b: 22" aria-label="Gold theme" hidden></button>
                    </div>
                </header>

                <div class="display" title="Click to copy">
                    <div id="expression"></div>
                    <div id="answer"></div>
                </div>

                <div class="buttons">
                    <button class="clear" data-symbol="AC" aria-label="Clear">C</button>
                    <button class="op" data-symbol="÷" aria-label="Divide">/</button>

                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="op" data-symbol="×" aria-label="Multiply">*</button>

                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="op" data-symbol="−" aria-label="Subtract">-</button>

                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="op" aria-label="Add">+</button>

                    <button class="zero">0</button>
                    <button>.</button>
                    <button class="equals" aria-label="Equals">=</button>
                </div>
            </div>
        </div>

        <nav class="dock" aria-label="Extras">
            <button class="dock-btn" type="button" id="history-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/></svg>
                <span>History</span>
            </button>
            <button class="dock-btn icon-only" type="button" id="sound-btn" aria-pressed="false" aria-label="Sound">
                <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>
            </button>
            <button class="dock-btn" type="button" id="secrets-btn" aria-label="Secrets found">
                <span class="egg" aria-hidden="true">🥚</span>
                <span id="secret-count">0/13</span>
            </button>
        </nav>
        <p class="hint"><span class="kbd-hint">Type on your keyboard · </span>Click the display to copy</p>
    </main>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="toasts" aria-live="polite"></div>

    <dialog class="drawer" id="history-panel" aria-labelledby="history-title">
        <div class="panel">
            <header class="panel-head">
                <div>
                    <h2 id="history-title">History</h2>
                    <p class="panel-sub">Tap a result to use it again</p>
                </div>
                <button class="icon-btn" type="button" data-close aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <ul class="history-list" id="history-list"></ul>
            <p class="empty" id="history-empty">No calculations yet.<br>Your math will show up here.</p>
            <button class="pill" type="button" id="history-clear">Clear history</button>
        </div>
    </dialog>

    <dialog class="sheet" id="secrets-panel" aria-labelledby="secrets-title">
        <div class="panel">
            <header class="panel-head">
                <div>
                    <h2 id="secrets-title">Secrets</h2>
                    <p class="panel-sub" id="secrets-sub"></p>
                </div>
                <button class="icon-btn" type="button" data-close aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <div class="progress"><span id="secrets-bar"></span></div>
            <ul class="secret-list" id="secret-list"></ul>
            <button class="pill" type="button" id="secrets-reset">Reset progress</button>
        </div>
    </dialog>

    <dialog class="sheet signature" id="signature-panel" aria-labelledby="signature-name">
        <div class="panel">
            <div class="sig-orb" aria-hidden="true"></div>
            <p class="sig-kicker">Crafted by</p>
            <h2 class="sig-name" id="signature-name">Hamza Sallam</h2>
            <p class="sig-sub">Every number has a story. Thanks for poking around.</p>
            <button class="pill" type="button" data-close>Close</button>
        </div>
    </dialog>

    <script src="script.js"></script>
    <script src="effects.js"></script>
</body>
</html>
